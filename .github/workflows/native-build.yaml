---
name: Native Build
on:
  workflow_call:
    inputs:
      build_version:
        description: "The version to build.  It must be semver-compliant, and must not be for a tag that already exists."
        required: false
        type: string
  workflow_dispatch:
    inputs:
      build_version:
        description: "Optional version string to embed in the build (defaults to 0.0.0-pre.0)."
        required: false
        type: string

permissions:
  contents: read

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-x86_64
            runs-on: ubuntu-latest
          - classifier: linux-aarch_64
            runs-on: ubuntu-24.04-arm
          - classifier: osx-aarch_64
            runs-on: macos-latest
          - classifier: windows-x86_64
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: 'true'
          fetch-depth: 0

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@f744c72a42b1995d7b0cbc314bde4bace7ac1fe1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          native-image-job-reports: 'true'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # https://github.com/gradle/actions/releases/tag/v6.1.0

      - name: Determine Build Version
        env:
          ENGINE_BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          ./gradlew writeVersion

      - name: Read Version File
        id: getversion
        shell: bash
        run: |
          test -f build/version.txt
          echo "version=$(cat build/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Native Compile
        env:
          ENGINE_BUILD_VERSION: ${{ steps.getversion.outputs.version }}
        run: |
          ./gradlew :protoc-utils-recorder:nativeCompile

      - name: Stage Binary
        shell: bash
        env:
          CLASSIFIER: ${{ matrix.classifier }}
          VERSION: ${{ steps.getversion.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p staging
          src="recorder/build/native/nativeCompile/protoc-utils-recorder-${CLASSIFIER}.exe"
          test -f "$src" || { echo "expected native binary not found at $src"; ls -al recorder/build/native/nativeCompile; exit 1; }
          cp "$src" "staging/protoc-utils-recorder-${VERSION}-${CLASSIFIER}.exe"
          ls -al staging

      - name: Upload Native Binary
        uses: actions/upload-artifact@v4
        with:
          name: dist-native-${{ matrix.classifier }}
          path: staging/*
          if-no-files-found: error
